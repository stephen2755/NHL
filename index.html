<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NHL Model | Daily Card</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#e8edf5;background:#0c1422}*{box-sizing:border-box}body{margin:0}header{background:#101d30;border-bottom:1px solid #2b3c54;padding:20px max(16px,calc((100vw - 1100px)/2))}h1{margin:0;font-size:28px}p{color:#aebdd1}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,input{border:1px solid #3b506b;border-radius:8px;padding:10px 14px;background:#17273c;color:white;font:inherit}button{cursor:pointer}button.active{background:#285a9b}.card{background:#142238;border:1px solid #2c3e56;border-radius:12px;margin:12px 0;padding:18px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{background:#1b304b;padding:16px;border-radius:9px;text-align:center}.score{font-size:32px;font-weight:800}.small{font-size:12px;color:#afbed1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.meter{height:8px;background:#293a50;border-radius:9px;overflow:hidden;margin:8px 0}.meter span{display:block;height:100%;background:#4a9af0}.error{color:#ffc6aa}a{color:#9dc6ff}footer{color:#9eacc0;padding:30px 0;font-size:12px}</style></head><body><header><h1>🏒 NHL Model</h1><div class="small">Daily projections · Score forecasts · Performance tracking</div></header><main class="wrap"><p id="status">Loading NHL schedule and standings…</p><div class="toolbar"><input type="date" id="date"><button id="refresh">Refresh now</button><button class="active" data-tab="games">Games</button><button data-tab="results">Results</button><button data-tab="backtest">Backtest</button><button data-tab="about">Method</button></div><section id="content"></section><footer>Independent research model. Experimental baseline projections, not validated forecasts. NHL data supplied by the NHL public API. Not affiliated with the NHL.</footer></main><script src="app.js"></script></body></html>
