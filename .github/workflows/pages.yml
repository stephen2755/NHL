name: Deploy NHL Daily Card
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site-data/forecasts/**'
      - 'site-data/results-*.json'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download NHL data for browser-safe static hosting
        run: python scripts/fetch_nhl.py
      - name: Fetch NHL injury statuses
        continue-on-error: true
        run: python scripts/fetch_injuries.py
      - name: Fetch Daily Faceoff goalie statuses (best effort)
        continue-on-error: true
        run: python scripts/fetch_goalies.py
      - name: Walk-forward backtest (2025-26 regular season)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python scripts/backtest.py
      - name: Archive pregame forecasts from the live model
        continue-on-error: true
        run: node scripts/archive_forecasts.js
      - name: Persist immutable forecast snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data/forecasts/
          if ! git diff --cached --quiet; then
            git commit -m "Archive pregame NHL projections [skip ci]"
            git push
          fi
      - name: Refresh final-score and scorer comparisons with archived forecasts
        run: python scripts/fetch_nhl.py
      - name: Preserve completed game results and schedules for long-term evaluation
        run: |
          git add site-data/results-*.json site-data/????-??-??.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve NHL final boxscores and schedules [skip ci]"
            git push
          fi
      - name: Audit historical pregame forecast coverage
        run: python scripts/history_coverage.py
      - name: Calculate SOG projection accuracy
        run: python scripts/sog_accuracy.py
      - name: Calculate archived scorer hit rates
        run: python scripts/scorer_hit_rates.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
